services:
  job-hunter:
    build: .
    container_name: job-hunter-engine
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: python main.py

  discord-bot:
    build: .
    container_name: job-hunter-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: python discord_bot.py
