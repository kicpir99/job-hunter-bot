name: Cykliczny monitor ofert pracy

on:
  schedule:
    # Uruchamianie w dni robocze (pn-pt) co 30 minut w godzinach 7:30 - 19:00 czasu polskiego (UTC: 6:30 - 18:00)
    - cron: '*/30 6-17 * * 1-5'
  workflow_dispatch: # Pozwala odpalić ręcznie jednym kliknięciem w panelu GitHub Actions

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja zależności
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie bota
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Zapisanie zaktualizowanej bazy ofert (git commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db || true
          git commit -m "chore: aktualizacja bazy widzianych ofert [skip ci]" || true
          git pull --rebase || true
          git push || true

